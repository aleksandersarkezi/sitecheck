# Production stack: Caddy (TLS + reverse proxy) -> app (FastAPI) + monitor.
#
# On the server, in the folder that holds this file:
#   cp .env.example .env && nano .env       # domain, webhook, image tag
#   cp sites.example.txt sites.txt          # sites to monitor
#   docker compose up -d
#
# Images are built by GitHub Actions and pulled from GHCR; the server never
# needs the source code or build tools.

x-app-common: &app-common
  image: ghcr.io/aleksandersarkezi/sitecheck:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment:
    SITECHECK_DB: /data/sitecheck.db
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - app_data:/data
  # Hardening: the app never needs root, extra capabilities or a writable
  # filesystem outside /data and /tmp.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks: [backend]

services:
  app:
    <<: *app-common
    environment:
      SITECHECK_DB: /data/sitecheck.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SITECHECK_RATE_LIMIT: ${SITECHECK_RATE_LIMIT:-6}
      SITECHECK_CACHE_SECONDS: ${SITECHECK_CACHE_SECONDS:-600}
      SITECHECK_MAX_CONCURRENT: ${SITECHECK_MAX_CONCURRENT:-4}
    # No "ports:" on purpose. Only Caddy can reach the app.
    expose: ["8000"]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.75"

  monitor:
    <<: *app-common
    command:
      - sitecheck-monitor
      - --watchlist=/config/sites.txt
      - --db=/data/sitecheck.db
      - --every=${MONITOR_INTERVAL_SECONDS:-21600}
      - --initial-delay=60
    environment:
      SITECHECK_DB: /data/sitecheck.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SITECHECK_WEBHOOK_URL: ${SITECHECK_WEBHOOK_URL:-}
    volumes:
      - app_data:/data
      - ./sites.txt:/config/sites.txt:ro
    # The monitor checks its first site right after it starts. During a deploy
    # the app restarts at the same time, so without this it would scan a 502
    # error page from Caddy and report a false grade drop.
    depends_on:
      app:
        condition: service_healthy
      caddy:
        condition: service_started
    # The monitor serves no HTTP, so the image's healthcheck doesn't apply.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates, keep this volume!
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [backend]

volumes:
  app_data:
  caddy_data:
  caddy_config:

networks:
  backend:
