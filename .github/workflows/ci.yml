name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker:
    # Build the production image and make sure it actually starts and answers
    # its health check. Catches Dockerfile mistakes before they reach the server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sitecheck:ci .

      - name: Smoke test
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8000:8000 sitecheck:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          # Input validation must work inside the container too.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/api/check?host=localhost')" = "400"
          docker run --rm --entrypoint sitecheck-monitor sitecheck:ci --help > /dev/null
          echo "image OK"

      - name: Container logs
        if: always()
        run: docker logs smoke || true
