name: Deploy

# Runs after the CI workflow finishes successfully on main: build the image,
# push it to GHCR, then roll it out on the VPS. A failed health check rolls
# back to the previous image automatically.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # workflow_run starts on the default branch; build exactly the commit CI tested.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    # Only deploy commits that passed CI (or a manual run).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - id: tag
        run: echo "tag=sha-${COMMIT::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Check that deploy secrets exist
        id: secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "VPS secrets not configured yet, skipping deploy (image is still pushed)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: no "trust on first use", so a spoofed server
          # can't receive the deploy.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload stack files and roll out
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          rsync -az -e "$SSH" deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh \
            "$USER@$HOST:~/sitecheck/"
          # The static home page; --delete removes files that were deleted in git.
          rsync -az --delete -e "$SSH" deploy/site/ "$USER@$HOST:~/sitecheck/site/"
          $SSH "$USER@$HOST" "bash ~/sitecheck/deploy.sh '$TAG'"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
