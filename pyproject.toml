[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitecheck"
version = "0.2.0"
description = "Passive security and TLS checker for websites, scored A-F"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Aleks" }]
keywords = ["security", "tls", "headers", "cli", "website"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "sitecheck[service]",
]

[project.scripts]
sitecheck = "sitecheck.cli:main"
sitecheck-monitor = "sitecheck.service.monitor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sitecheck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
